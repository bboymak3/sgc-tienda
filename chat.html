<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — SGC Tienda</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e8e8e8;height:100vh;display:flex;flex-direction:column}
:root{--green:#22c55e;--bg:#0a0a0a;--bg1:#111;--bg2:#1a1a1a;--bg3:#222;--border:#2a2a2a;--text:#e8e8e8;--muted:#999;--dim:#666}

/* Layout */
.layout{display:flex;flex:1;overflow:hidden}
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.cart-area{width:320px;background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s}
@media(max-width:768px){.cart-area{position:fixed;right:0;top:0;bottom:0;z-index:200;transform:translateX(100%)}.cart-area.open{transform:translateX(0)}}

/* Header */
.header{padding:12px 16px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.header h3{font-size:.95rem;font-weight:700}
.header .status{font-size:.7rem;color:#6ee7b7}
.cart-toggle{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.8rem;position:relative}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--green);color:#042713;font-size:.65rem;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* Chat */
#chat{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
.msg{max-width:80%;margin-bottom:10px;padding:10px 14px;border-radius:12px;font-size:.9rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:var(--bg3);border:1px solid var(--border)}
.msg.user{background:var(--green);color:#042713;margin-left:auto;text-align:right}
.typing{color:var(--dim);font-size:.85rem;padding:8px}

/* Input */
.input-bar{padding:12px;background:var(--bg1);border-top:1px solid var(--border);display:flex;gap:8px}
input{flex:1;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:.95rem;outline:none;font-family:inherit}
input:focus{border-color:var(--green)}
button.send-btn{background:var(--green);color:#042713;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:1rem}
button:disabled{opacity:.5}

/* Cart */
.cart-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.cart-header h3{font-size:1rem;font-weight:700}
.cart-close{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer}
.cart-items{flex:1;overflow-y:auto;padding:12px}
.cart-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-price{font-size:.75rem;color:var(--muted)}
.cart-item-qty{display:flex;align-items:center;gap:6px}
.cart-item-qty button{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.cart-item-qty span{font-size:.85rem;font-weight:600;min-width:20px;text-align:center}
.cart-item-remove{background:none;border:none;color:#ef4444;cursor:pointer;font-size:.9rem;padding:4px}
.cart-empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:.85rem}
.cart-footer{padding:16px;border-top:1px solid var(--border)}
.cart-total{display:flex;justify-content:space-between;margin-bottom:12px;font-size:1rem;font-weight:700}
.cart-total .price{color:var(--green)}
.checkout-btn{display:block;width:100%;padding:12px;background:var(--green);color:#042713;border:none;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;text-align:center}
.checkout-btn:hover{background:#fff}
.checkout-btn:disabled{opacity:.5;cursor:not-allowed}

/* Products in chat */
.product-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;margin:6px 0;display:flex;align-items:center;gap:10px}
.product-card-info{flex:1}
.product-card-name{font-size:.85rem;font-weight:600}
.product-card-price{font-size:.8rem;color:var(--green)}
.product-card-add{background:var(--green);color:#042713;border:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:.8rem;cursor:pointer;white-space:nowrap}
.product-card-add:hover{background:#fff}

.wa-btn{display:block;width:100%;margin-top:8px;padding:10px;background:#25D366;color:#fff;border:none;border-radius:10px;font-weight:600;text-align:center;text-decoration:none;font-size:.85rem}
.wa-btn:hover{background:#1da851}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="layout">
<!-- CHAT AREA -->
<div class="chat-area">
<div class="header">
<div>
<h3 id="botTitle">Tienda Virtual</h3>
<span class="status" id="botStatus">● En línea</span>
</div>
<button class="cart-toggle" onclick="toggleCart()">
<i class="fas fa-shopping-cart"></i> Carrito
<span class="cart-badge" id="cartBadge" style="display:none">0</span>
</button>
</div>
<div id="chat"></div>
<div class="input-bar">
<input id="input" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter')send()">
<button class="send-btn" id="sendBtn" onclick="send()"><i class="fas fa-paper-plane"></i></button>
</div>
</div>

<!-- CART AREA -->
<div class="cart-area" id="cartArea">
<div class="cart-header">
<h3><i class="fas fa-shopping-cart"></i> Tu Carrito</h3>
<button class="cart-close" onclick="toggleCart()">&times;</button>
</div>
<div class="cart-items" id="cartItems">
<div class="cart-empty">Tu carrito está vacío.<br>Agrega productos desde el chat o la lista.</div>
</div>
<div class="cart-footer">
<div class="cart-total">
<span>Total:</span>
<span class="price" id="cartTotal">$0</span>
</div>
<button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>Finalizar Compra</button>
</div>
</div>
</div>

<a id="waBtn" class="wa-btn" style="display:none" target="_blank"><i class="fab fa-whatsapp"></i> Hablar con una persona por WhatsApp</a>

<script>
const API = ''; // Same origin (Pages Advanced Mode)
const params = new URLSearchParams(location.search);
const TENANT = params.get('t') || 1;
let history = [];
let sessionId = null;
let cart = [];
let products = [];
let config = {};

async function init() {
  try {
    // Cargar config
    const cfgRes = await fetch(`${API}/api/config?t=${TENANT}`);
    const cfgData = await cfgRes.json();
    config = cfgData.config || {};
    document.getElementById('botTitle').textContent = config.bot_name || 'Tienda Virtual';

    // Cargar productos
    const prodRes = await fetch(`${API}/api/products?t=${TENANT}`);
    const prodData = await prodRes.json();
    products = prodData.products || [];

    // Mensaje de bienvenida + lista de productos
    let welcome = config.welcome_message || 'Hola! Bienvenido a nuestra tienda.';
    if (products.length > 0) {
      welcome += '\n\nEstos son nuestros productos disponibles:';
      // Mostrar máximo 5 productos destacados o los primeros 5
      const featured = products.filter(p => p.destacado).slice(0, 5);
      const toShow = featured.length > 0 ? featured : products.slice(0, 5);
      for (const p of toShow) {
        welcome += `\n• ${p.nombre} — $${p.precio_oferta || p.precio}`;
      }
      if (products.length > 5) {
        welcome += `\n\n...y ${products.length - 5} productos más. Pregúntame por lo que buscas!`;
      }
      welcome += '\n\nTambién puedes agregar productos al carrito 🛒 y finalizar tu compra al terminar.';
    }
    addMsg('bot', welcome);
    history.push({ role: 'assistant', content: welcome });

    // Mostrar productos como cards clickeables
    if (products.length > 0) {
      showProductsInChat(products.slice(0, 8));
    }

    // WhatsApp
    if (config.whatsapp_enabled === 'true' && config.whatsapp_number) {
      const wa = document.getElementById('waBtn');
      const msg = encodeURIComponent(config.whatsapp_message || 'Hola, quiero hablar con una persona real');
      wa.href = `https://wa.me/${config.whatsapp_number}?text=${msg}`;
      wa.style.display = 'block';
    }
  } catch(e) {
    addMsg('bot', 'Hola! Bienvenido a nuestra tienda. En que puedo ayudarte?');
    history.push({ role: 'assistant', content: 'Hola! Bienvenido a nuestra tienda. En que puedo ayudarte?' });
  }
}

function showProductsInChat(prods) {
  const chat = document.getElementById('chat');
  for (const p of prods) {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-card-info">
        <div class="product-card-name">${escapeHtml(p.nombre)}</div>
        <div class="product-card-price">$${p.precio_oferta || p.precio} ${config.moneda || 'CLP'}</div>
      </div>
      <button class="product-card-add" onclick="addToCart(${p.id})"><i class="fas fa-plus"></i> Agregar</button>
    `;
    chat.appendChild(card);
  }
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span class="spinner"></span> escribiendo...';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping() { document.getElementById('typingIndicator')?.remove(); }

// === CART ===
function toggleCart() {
  document.getElementById('cartArea').classList.toggle('open');
}

function addToCart(productId) {
  const product = products.find(p => p.id === productId);
  if (!product) return;
  const existing = cart.find(item => item.id === productId);
  if (existing) {
    existing.cantidad++;
  } else {
    cart.push({ ...product, cantidad: 1 });
  }
  updateCart();
  // Notificación visual
  const badge = document.getElementById('cartBadge');
  badge.textContent = cart.reduce((s, i) => s + i.cantidad, 0);
  badge.style.display = 'block';
  // Mensaje en chat
  addMsg('bot', `✓ ${product.nombre} agregado al carrito. Total: ${cart.length} producto(s).`);
}

function removeFromCart(productId) {
  cart = cart.filter(item => item.id !== productId);
  updateCart();
}

function changeQty(productId, delta) {
  const item = cart.find(i => i.id === productId);
  if (!item) return;
  item.cantidad += delta;
  if (item.cantidad <= 0) {
    removeFromCart(productId);
  } else {
    updateCart();
  }
}

function updateCart() {
  const container = document.getElementById('cartItems');
  const totalQty = cart.reduce((s, i) => s + i.cantidad, 0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = totalQty;
  badge.style.display = totalQty > 0 ? 'block' : 'none';

  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty">Tu carrito está vacío.<br>Agrega productos desde el chat.</div>';
    document.getElementById('checkoutBtn').disabled = true;
  } else {
    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${escapeHtml(item.nombre)}</div>
          <div class="cart-item-price">$${item.precio_oferta || item.precio} c/u</div>
        </div>
        <div class="cart-item-qty">
          <button onclick="changeQty(${item.id}, -1)">−</button>
          <span>${item.cantidad}</span>
          <button onclick="changeQty(${item.id}, 1)">+</button>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart(${item.id})"><i class="fas fa-trash"></i></button>
      </div>
    `).join('');
    document.getElementById('checkoutBtn').disabled = false;
  }

  const total = cart.reduce((sum, item) => sum + (item.precio_oferta || item.precio) * item.cantidad, 0);
  document.getElementById('cartTotal').textContent = '$' + total.toLocaleString('es-CL');
}

function checkout() {
  if (cart.length === 0) return;
  // Construir mensaje del carrito para el bot
  let cartMsg = 'Quiero hacer un pedido con los siguientes productos del carrito:\n';
  let total = 0;
  for (const item of cart) {
    const subtotal = (item.precio_oferta || item.precio) * item.cantidad;
    total += subtotal;
    cartMsg += `• ${item.cantidad}x ${item.nombre} — $${subtotal}\n`;
  }
  cartMsg += `\nTotal: $${total}\n\nMi nombre es: `;
  // Enviar al bot
  document.getElementById('input').value = cartMsg;
  document.getElementById('cartArea').classList.remove('open');
  send();
  // El bot tomará el pedido y pedirá los datos restantes
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  addTyping();
  try {
    const res = await fetch(`${API}/api/chat?t=${TENANT}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, session_id: sessionId })
    });
    const data = await res.json();
    if (data.error) {
      addMsg('bot', 'Lo siento, hubo un error: ' + data.error);
    } else {
      addMsg('bot', data.response);
      history.push({ role: 'assistant', content: data.response });
      if (data.session_id) sessionId = data.session_id;
    }
  } catch(e) {
    addMsg('bot', 'Error de conexion. Intenta de nuevo.');
  }
  removeTyping();
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('input').focus();
}

init();
</script>
</body>
</html>

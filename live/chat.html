<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Chat — SGC Tienda</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e8e8e8;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
:root{--green:#22c55e;--bg:#0a0a0a;--bg1:#111;--bg2:#1a1a1a;--bg3:#222;--border:#2a2a2a;--text:#e8e8e8;--muted:#999;--dim:#666}

/* Layout */
.layout{display:flex;flex:1;overflow:hidden;min-height:0}
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.cart-area{width:320px;background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s}
@media(max-width:768px){.cart-area{position:fixed;right:0;top:0;bottom:0;z-index:200;transform:translateX(100%)}.cart-area.open{transform:translateX(0)}}

/* Header */
.header{padding:10px 14px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.header h3{font-size:.9rem;font-weight:700}
.header .status{font-size:.68rem;color:#6ee7b7}
.cart-toggle{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.78rem;position:relative}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--green);color:#042713;font-size:.65rem;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* Chat */
#chat{flex:1;overflow-y:auto;padding:14px;background:var(--bg);min-height:0;-webkit-overflow-scrolling:touch}
.msg{max-width:85%;margin-bottom:10px;padding:10px 14px;border-radius:12px;font-size:.88rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:var(--bg3);border:1px solid var(--border)}
.msg.user{background:var(--green);color:#042713;margin-left:auto;text-align:right}
.typing{color:var(--dim);font-size:.85rem;padding:8px}

/* Input */
.input-bar{padding:10px;background:var(--bg1);border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
input{flex:1;padding:11px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:.95rem;outline:none;font-family:inherit}
input:focus{border-color:var(--green)}
button.send-btn{background:var(--green);color:#042713;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:1rem}
button:disabled{opacity:.5}

/* Cart */
.cart-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.cart-header h3{font-size:1rem;font-weight:700}
.cart-close{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer}
.cart-items{flex:1;overflow-y:auto;padding:12px}
.cart-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-price{font-size:.75rem;color:var(--muted)}
.cart-item-qty{display:flex;align-items:center;gap:6px}
.cart-item-qty button{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.cart-item-qty span{font-size:.85rem;font-weight:600;min-width:20px;text-align:center}
.cart-item-remove{background:none;border:none;color:#ef4444;cursor:pointer;font-size:.9rem;padding:4px}
.cart-empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:.85rem}
.cart-footer{padding:16px;border-top:1px solid var(--border)}
.cart-total{display:flex;justify-content:space-between;margin-bottom:12px;font-size:1rem;font-weight:700}
.cart-total .price{color:var(--green)}
.checkout-btn{display:block;width:100%;padding:12px;background:var(--green);color:#042713;border:none;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;text-align:center}
.checkout-btn:hover{background:#fff}
.checkout-btn:disabled{opacity:.5;cursor:not-allowed}

/* Products in chat */
.product-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;margin:6px 0;display:flex;align-items:center;gap:12px;transition:border-color .2s}
.product-card:hover{border-color:var(--green)}
.product-card-img{width:80px!important;height:80px!important;border-radius:8px;object-fit:contain!important;background:var(--bg3);flex-shrink:0;cursor:pointer;padding:2px;max-width:80px!important;max-height:80px!important}
.product-card-img-placeholder{width:80px;height:80px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:1.5rem;flex-shrink:0}
.product-card-info{flex:1;min-width:0}
.product-card-name{font-size:.85rem;font-weight:600;line-height:1.3;margin-bottom:2px}
.product-card-desc{font-size:.72rem;color:var(--muted);line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card-price{font-size:.9rem;color:var(--green);font-weight:700}
.product-card-cat{display:inline-block;font-size:.65rem;color:var(--muted);background:var(--bg3);padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.product-card-add{background:var(--green);color:#042713;border:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:.78rem;cursor:pointer;white-space:nowrap;flex-shrink:0}
.product-card-add:hover{background:#fff}

/* Product modal (image view) */
.product-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);gap:14px;overflow-y:auto}
.product-modal-img{max-width:90vw;max-height:75vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.product-modal-close{position:fixed;top:20px;right:20px;background:var(--bg3);color:#fff;border:1px solid var(--border);width:40px;height:40px;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.product-modal-info{background:var(--bg1);border:1px solid var(--border);border-radius:12px;padding:14px 20px;max-width:500px;width:calc(100% - 40px);text-align:center;z-index:10}
.product-modal-info h4{font-size:1rem;font-weight:700;margin-bottom:4px;color:#fff}
.product-modal-info p{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.product-modal-info .price{font-size:1.1rem;color:var(--green);font-weight:700}

/* Galería con scroll horizontal */
.product-modal-gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;width:100%;max-width:90vw;max-height:75vh;border-radius:12px;scrollbar-width:thin;scrollbar-color:var(--green) transparent;-webkit-overflow-scrolling:touch}
.product-modal-gallery::-webkit-scrollbar{height:6px}
.product-modal-gallery::-webkit-scrollbar-track{background:transparent}
.product-modal-gallery::-webkit-scrollbar-thumb{background:var(--green);border-radius:3px}
.product-modal-gallery-item{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;width:100%}
.product-modal-gallery-item img{max-width:90vw;max-height:70vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);object-fit:contain}
.product-modal-gallery-nav{display:flex;align-items:center;justify-content:center;gap:20px;background:var(--bg1);border:1px solid var(--border);border-radius:30px;padding:8px 16px;z-index:10}
.product-modal-gallery-prev,.product-modal-gallery-next{background:var(--green);color:#042713;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.product-modal-gallery-prev:hover,.product-modal-gallery-next:hover{background:#fff}
.product-modal-gallery-counter{color:#fff;font-size:.85rem;font-weight:600;min-width:60px;text-align:center}

/* Cart item image */
.cart-item-img{width:40px;height:40px;border-radius:6px;object-fit:contain;flex-shrink:0;background:var(--bg3);padding:2px}

.wa-btn{display:block;width:100%;margin-top:8px;padding:10px;background:#25D366;color:#fff;border:none;border-radius:10px;font-weight:600;text-align:center;text-decoration:none;font-size:.85rem}
.wa-btn:hover{background:#1da851}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ RESPONSIVE ============ */

/* Tablets y pantallas medianas */
@media(max-width:768px){
  .layout{flex-direction:column}
  .cart-area{width:100%;max-width:100%;border-left:none;border-top:1px solid var(--border);max-height:50vh}
  .header{padding:10px 12px}
  .header h3{font-size:.9rem}
  .header .status{font-size:.65rem}
  .cart-toggle{padding:6px 10px;font-size:.75rem}
  #chat{padding:12px}
  .msg{max-width:88%;font-size:.88rem;padding:9px 12px}
  .input-bar{padding:8px 10px;gap:6px}
  input{padding:10px 14px;font-size:.9rem}
  .send-btn{padding:0 16px}
  .product-card{padding:8px;gap:10px}
  .product-card-img{width:64px!important;height:64px!important;max-width:64px!important;max-height:64px!important}
  .product-card-img-placeholder{width:64px;height:64px}
  .product-card-name{font-size:.82rem}
  .product-card-desc{font-size:.68rem}
  .product-card-price{font-size:.85rem}
  .product-card-add{padding:6px 10px;font-size:.72rem}
}

/* Móviles pequeños */
@media(max-width:480px){
  body{font-size:.85rem}
  .header{padding:8px 10px;gap:8px}
  .header h3{font-size:.85rem}
  .header .status{font-size:.6rem}
  .cart-toggle{padding:5px 8px;font-size:.7rem}
  .cart-toggle i{font-size:.8rem}
  #chat{padding:10px 8px}
  .msg{max-width:92%;font-size:.84rem;padding:8px 11px;border-radius:10px}
  .input-bar{padding:6px 8px}
  input{padding:9px 12px;font-size:.85rem;border-radius:8px}
  .send-btn{padding:0 14px;border-radius:8px;font-size:.9rem}
  .product-card{padding:7px;gap:8px;border-radius:8px}
  .product-card-img{width:56px!important;height:56px!important;max-width:56px!important;max-height:56px!important}
  .product-card-img-placeholder{width:56px;height:56px}
  .product-card-name{font-size:.78rem}
  .product-card-desc{display:none}
  .product-card-price{font-size:.82rem}
  .product-card-add{padding:5px 8px;font-size:.68rem}
  .product-card-add i{font-size:.7rem}
  /* Modal responsive */
  .product-modal{padding:10px;gap:10px}
  .product-modal-close{top:10px;right:10px;width:36px;height:36px;font-size:1.1rem}
  .product-modal-gallery{max-width:95vw;max-height:60vh}
  .product-modal-gallery-item img{max-width:95vw;max-height:55vh}
  .product-modal-img{max-width:95vw;max-height:60vh}
  .product-modal-info{width:calc(100% - 20px);padding:10px 14px}
  .product-modal-info h4{font-size:.9rem}
  .product-modal-info p{font-size:.78rem}
  .product-modal-info .price{font-size:1rem}
  .product-modal-gallery-nav{padding:6px 12px;gap:14px}
  .product-modal-gallery-prev,.product-modal-gallery-next{width:32px;height:32px;font-size:.8rem}
  .product-modal-gallery-counter{font-size:.78rem;min-width:50px}
  /* Carrito responsive */
  .cart-area{max-height:60vh}
  .cart-header{padding:12px}
  .cart-header h3{font-size:.9rem}
  .cart-item{padding:8px;gap:8px}
  .cart-item-img{width:36px;height:36px}
  .cart-item-name{font-size:.8rem}
  .cart-item-price{font-size:.7rem}
  .cart-footer{padding:10px}
  .checkout-btn{padding:10px;font-size:.85rem}
}

/* Móviles muy pequeños */
@media(max-width:360px){
  .header h3{font-size:.8rem}
  .product-card-img{width:48px!important;height:48px!important;max-width:48px!important;max-height:48px!important}
  .product-card-img-placeholder{width:48px;height:48px}
  .msg{font-size:.8rem;padding:7px 10px}
  input{font-size:.8rem;padding:8px 10px}
}

/* Modal en orientación landscape (móvil horizontal) */
@media(max-height:500px) and (orientation:landscape){
  .product-modal{flex-direction:row;justify-content:center;align-items:center;gap:12px;padding:10px}
  .product-modal-gallery{max-height:80vh;max-width:60vw}
  .product-modal-gallery-item img{max-height:70vh;max-width:55vw}
  .product-modal-info{max-width:280px}
}
</style>
</head>
<body>

<div class="layout">
<!-- CHAT AREA -->
<div class="chat-area">
<div class="header">
<div>
<h3 id="botTitle">Tienda Virtual</h3>
<span class="status" id="botStatus">● En línea</span>
</div>
<button class="cart-toggle" onclick="toggleCart()">
<i class="fas fa-shopping-cart"></i> Carrito
<span class="cart-badge" id="cartBadge" style="display:none">0</span>
</button>
</div>
<div id="chat"></div>
<div class="input-bar">
<input id="input" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter')send()">
<button class="send-btn" id="sendBtn" onclick="send()"><i class="fas fa-paper-plane"></i></button>
</div>
</div>

<!-- CART AREA -->
<div class="cart-area" id="cartArea">
<div class="cart-header">
<h3><i class="fas fa-shopping-cart"></i> Tu Carrito</h3>
<button class="cart-close" onclick="toggleCart()">&times;</button>
</div>
<div class="cart-items" id="cartItems">
<div class="cart-empty">Tu carrito está vacío.<br>Agrega productos desde el chat o la lista.</div>
</div>
<div class="cart-footer">
<div class="cart-total">
<span>Total:</span>
<span class="price" id="cartTotal">$0</span>
</div>
<button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>Finalizar Compra</button>
</div>
</div>
</div>

<a id="waBtn" class="wa-btn" style="display:none" target="_blank"><i class="fab fa-whatsapp"></i> Hablar con una persona por WhatsApp</a>

<script>
const API = ''; // Same origin (Pages Advanced Mode)
const params = new URLSearchParams(location.search);
const TENANT = params.get('t') || 1;
let history = [];
let sessionId = null;
let cart = [];
let products = [];
let config = {};

async function init() {
  try {
    // Cargar config
    const cfgRes = await fetch(`${API}/api/config?t=${TENANT}`);
    const cfgData = await cfgRes.json();
    config = cfgData.config || {};
    document.getElementById('botTitle').textContent = config.bot_name || 'Tienda Virtual';

    // Cargar productos
    const prodRes = await fetch(`${API}/api/products?t=${TENANT}`);
    const prodData = await prodRes.json();
    products = prodData.products || [];

    // Mensaje de bienvenida (sin mostrar productos automaticamente)
    let welcome = config.welcome_message || 'Hola! Bienvenido a nuestra tienda.';
    addMsg('bot', welcome);
    history.push({ role: 'assistant', content: welcome });

    // NO mostrar productos automaticamente. El cliente debe pedir ver fotos o productos.

    // WhatsApp
    if (config.whatsapp_enabled === 'true' && config.whatsapp_number) {
      const wa = document.getElementById('waBtn');
      const msg = encodeURIComponent(config.whatsapp_message || 'Hola, quiero hablar con una persona real');
      wa.href = `https://wa.me/${config.whatsapp_number}?text=${msg}`;
      wa.style.display = 'block';
    }
  } catch(e) {
    addMsg('bot', 'Hola! Bienvenido a nuestra tienda. En que puedo ayudarte?');
    history.push({ role: 'assistant', content: 'Hola! Bienvenido a nuestra tienda. En que puedo ayudarte?' });
  }
}

function showProductsInChat(prods) {
  const chat = document.getElementById('chat');
  for (const p of prods) {
    const card = document.createElement('div');
    card.className = 'product-card';
    const imgUrl = p.imagen_url || '';
    const imgHtml = imgUrl
      ? `<img src="${escapeHtml(imgUrl)}" class="product-card-img" style="width:80px!important;height:80px!important;object-fit:contain!important;border-radius:8px;background:var(--bg3);padding:2px;flex-shrink:0;cursor:pointer" alt="${escapeHtml(p.nombre)}" onclick="showProductImage('${escapeHtml(imgUrl)}','${escapeHtml(p.nombre)}','${escapeHtml((p.descripcion||'').replace(/'/g,''))}','${p.precio_oferta||p.precio}','${escapeHtml(p.imagen_url_2||'')}','${escapeHtml(p.imagen_url_3||'')}')" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="product-card-img-placeholder" style="display:none"><i class="fas fa-image"></i></div>`
      : `<div class="product-card-img-placeholder"><i class="fas fa-image"></i></div>`;
    card.innerHTML = `
      ${imgHtml}
      <div class="product-card-info">
        <div class="product-card-name">${escapeHtml(p.nombre)}<span class="product-card-cat">${escapeHtml(p.categoria||'')}</span></div>
        ${p.descripcion ? `<div class="product-card-desc">${escapeHtml(p.descripcion)}</div>` : ''}
        <div class="product-card-price">$${(p.precio_oferta || p.precio).toLocaleString('es-CL')} ${config.moneda || 'CLP'}</div>
      </div>
      <button class="product-card-add" onclick="addToCart(${p.id})"><i class="fas fa-plus"></i> Agregar</button>
    `;
    chat.appendChild(card);
  }
  chat.scrollTop = chat.scrollHeight;
}

function showProductImage(url, name, desc, price, img2, img3) {
  // Construir lista de imágenes (filtrar vacías y duplicadas)
  const imgs = [url, img2, img3].filter(u => u && u.trim() && u !== 'undefined' && u !== 'null');
  const uniqueImgs = [...new Set(imgs)];
  
  const modal = document.createElement('div');
  modal.className = 'product-modal';
  modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
  
  let galleryHtml;
  if (uniqueImgs.length > 1) {
    // Galería con scroll horizontal
    galleryHtml = `
      <div class="product-modal-gallery">
        ${uniqueImgs.map((u, i) => `
          <div class="product-modal-gallery-item">
            <img src="${escapeHtml(u)}" alt="${escapeHtml(name)} - foto ${i+1}">
          </div>
        `).join('')}
      </div>
      <div class="product-modal-gallery-nav">
        <button class="product-modal-gallery-prev" onclick="scrollGallery(event, -1)"><i class="fas fa-chevron-left"></i></button>
        <span class="product-modal-gallery-counter">1 / ${uniqueImgs.length}</span>
        <button class="product-modal-gallery-next" onclick="scrollGallery(event, 1)"><i class="fas fa-chevron-right"></i></button>
      </div>
    `;
  } else {
    galleryHtml = `<img src="${escapeHtml(url)}" class="product-modal-img" alt="${escapeHtml(name)}">`;
  }
  
  modal.innerHTML = `
    <button class="product-modal-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
    ${galleryHtml}
    <div class="product-modal-info">
      <h4>${escapeHtml(name)}</h4>
      ${desc ? `<p>${escapeHtml(desc)}</p>` : ''}
      <div class="price">$${parseInt(price).toLocaleString('es-CL')} ${config.moneda || 'CLP'}</div>
    </div>
  `;
  document.body.appendChild(modal);
  
  // Actualizar contador al hacer scroll
  if (uniqueImgs.length > 1) {
    const gallery = modal.querySelector('.product-modal-gallery');
    const counter = modal.querySelector('.product-modal-gallery-counter');
    const total = uniqueImgs.length;
    gallery.addEventListener('scroll', () => {
      const itemWidth = gallery.querySelector('.product-modal-gallery-item').offsetWidth;
      const currentIndex = Math.round(gallery.scrollLeft / itemWidth) + 1;
      counter.textContent = `${currentIndex} / ${total}`;
    });
  }
}

function scrollGallery(event, direction) {
  event.stopPropagation();
  const gallery = document.querySelector('.product-modal-gallery');
  if (!gallery) return;
  const itemWidth = gallery.querySelector('.product-modal-gallery-item').offsetWidth;
  gallery.scrollBy({ left: itemWidth * direction, behavior: 'smooth' });
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span class="spinner"></span> escribiendo...';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping() { document.getElementById('typingIndicator')?.remove(); }

// === CART ===
function toggleCart() {
  document.getElementById('cartArea').classList.toggle('open');
}

function addToCart(productId) {
  const product = products.find(p => p.id === productId);
  if (!product) return;
  const existing = cart.find(item => item.id === productId);
  if (existing) {
    existing.cantidad++;
  } else {
    cart.push({ ...product, cantidad: 1 });
  }
  updateCart();
  // Notificación visual
  const badge = document.getElementById('cartBadge');
  badge.textContent = cart.reduce((s, i) => s + i.cantidad, 0);
  badge.style.display = 'block';
  // Mensaje en chat
  addMsg('bot', `✓ ${product.nombre} agregado al carrito. Total: ${cart.length} producto(s).`);
}

function removeFromCart(productId) {
  cart = cart.filter(item => item.id !== productId);
  updateCart();
}

function changeQty(productId, delta) {
  const item = cart.find(i => i.id === productId);
  if (!item) return;
  item.cantidad += delta;
  if (item.cantidad <= 0) {
    removeFromCart(productId);
  } else {
    updateCart();
  }
}

function updateCart() {
  const container = document.getElementById('cartItems');
  const totalQty = cart.reduce((s, i) => s + i.cantidad, 0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = totalQty;
  badge.style.display = totalQty > 0 ? 'block' : 'none';

  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty">Tu carrito está vacío.<br>Agrega productos desde el chat.</div>';
    document.getElementById('checkoutBtn').disabled = true;
  } else {
    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        ${item.imagen_url ? `<img src="${escapeHtml(item.imagen_url)}" class="cart-item-img" alt="${escapeHtml(item.nombre)}" onerror="this.style.display='none'">` : ''}
        <div class="cart-item-info">
          <div class="cart-item-name">${escapeHtml(item.nombre)}</div>
          <div class="cart-item-price">$${(item.precio_oferta || item.precio).toLocaleString('es-CL')} c/u</div>
        </div>
        <div class="cart-item-qty">
          <button onclick="changeQty(${item.id}, -1)">−</button>
          <span>${item.cantidad}</span>
          <button onclick="changeQty(${item.id}, 1)">+</button>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart(${item.id})"><i class="fas fa-trash"></i></button>
      </div>
    `).join('');
    document.getElementById('checkoutBtn').disabled = false;
  }

  const total = cart.reduce((sum, item) => sum + (item.precio_oferta || item.precio) * item.cantidad, 0);
  document.getElementById('cartTotal').textContent = '$' + total.toLocaleString('es-CL');
}

function checkout() {
  if (cart.length === 0) return;
  // Construir mensaje del carrito para el bot
  let cartMsg = 'Quiero hacer un pedido con los siguientes productos del carrito:\n';
  let total = 0;
  for (const item of cart) {
    const subtotal = (item.precio_oferta || item.precio) * item.cantidad;
    total += subtotal;
    cartMsg += `• ${item.cantidad}x ${item.nombre} — $${subtotal}\n`;
  }
  cartMsg += `\nTotal: $${total}\n\nMi nombre es: `;
  // Enviar al bot
  document.getElementById('input').value = cartMsg;
  document.getElementById('cartArea').classList.remove('open');
  send();
  // El bot tomará el pedido y pedirá los datos restantes
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  addTyping();
  try {
    const res = await fetch(`${API}/api/chat?t=${TENANT}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, session_id: sessionId })
    });
    const data = await res.json();
    if (data.error) {
      addMsg('bot', 'Lo siento, hubo un error: ' + data.error);
    } else {
      let responseText = data.response || '';
      // Detectar marcador [FOTO:nombre-producto] o [FOTO:id]
      const fotoMatches = [...responseText.matchAll(/\[FOTO:([^\]]+)\]/gi)];
      let fotoNames = fotoMatches.map(m => m[1].trim());
      // Remover el marcador del texto que se muestra
      let cleanText = responseText.replace(/\[FOTO:[^\]]+\]/gi, '').trim();
      // Tambien detectar [LISTA] para mostrar todos los productos como cards
      const showList = /\[LISTA\]/i.test(responseText);
      cleanText = cleanText.replace(/\[LISTA\]/gi, '').trim();

      // Mostrar texto primero
      if (cleanText) {
        addMsg('bot', cleanText);
        history.push({ role: 'assistant', content: cleanText });
      }

      // Mostrar fotos solicitadas
      if (fotoNames.length > 0) {
        for (const name of fotoNames) {
          // Buscar producto por nombre (coincidencia parcial, case-insensitive)
          const found = products.find(p =>
            p.nombre.toLowerCase().includes(name.toLowerCase()) ||
            name.toLowerCase().includes(p.nombre.toLowerCase())
          );
          if (found) {
            showProductCard(found);
          }
        }
      }

      // Mostrar lista completa si se solicito
      if (showList) {
        showProductsInChat(products.slice(0, 12));
      }

      // Detectar si el bot confirmó un pedido (marcador [PEDIDO]...[/PEDIDO])
      // y vaciar el carrito automáticamente
      if (/\[PEDIDO\][\s\S]*?\[\/PEDIDO\]/i.test(responseText)) {
        cart = [];
        updateCart();
        console.log('Carrito vaciado automáticamente tras confirmar pedido');
      }

      if (data.session_id) sessionId = data.session_id;
    }
  } catch(e) {
    addMsg('bot', 'Error de conexion. Intenta de nuevo.');
  }
  removeTyping();
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('input').focus();
}

// Muestra una sola card de producto (cuando la IA envia [FOTO:...])
function showProductCard(p) {
  const chat = document.getElementById('chat');
  const card = document.createElement('div');
  card.className = 'product-card';
  const imgUrl = p.imagen_url || '';
  const imgHtml = imgUrl
    ? `<img src="${escapeHtml(imgUrl)}" class="product-card-img" style="width:80px!important;height:80px!important;object-fit:contain!important;border-radius:8px;background:var(--bg3);padding:2px;flex-shrink:0;cursor:pointer" alt="${escapeHtml(p.nombre)}" onclick="showProductImage('${escapeHtml(imgUrl)}','${escapeHtml(p.nombre)}','${escapeHtml((p.descripcion||'').replace(/'/g,''))}','${p.precio_oferta||p.precio}','${escapeHtml(p.imagen_url_2||'')}','${escapeHtml(p.imagen_url_3||'')}')" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="product-card-img-placeholder" style="display:none"><i class="fas fa-image"></i></div>`
    : `<div class="product-card-img-placeholder"><i class="fas fa-image"></i></div>`;
  card.innerHTML = `
    ${imgHtml}
    <div class="product-card-info">
      <div class="product-card-name">${escapeHtml(p.nombre)}<span class="product-card-cat">${escapeHtml(p.categoria||'')}</span></div>
      ${p.descripcion ? `<div class="product-card-desc">${escapeHtml(p.descripcion)}</div>` : ''}
      <div class="product-card-price">$${(p.precio_oferta || p.precio).toLocaleString('es-CL')} ${config.moneda || 'CLP'}</div>
    </div>
    <button class="product-card-add" onclick="addToCart(${p.id})"><i class="fas fa-plus"></i> Agregar</button>
  `;
  chat.appendChild(card);
  chat.scrollTop = chat.scrollHeight;
}

init();
</script>
